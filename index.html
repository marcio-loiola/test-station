<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Estação de Testes</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body id="login-page">

    <div class="container login-container">
        <div class="login-header">
            <h1>Sistema de Chamados</h1>
            <p>SENAI</p>
        </div>

        <div class="card">
            <h2>Login</h2>
            <div id="loginError" class="alert error"></div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="user">Usuário</label>
                    <input type="text" id="user" placeholder="Digite seu usuário">
                </div>
                <div class="form-group">
                    <label for="pass">Senha</label>
                    <input type="password" id="pass" placeholder="Digite sua senha">
                </div>
                <button type="submit" class="btn">Entrar</button>
            </form>
        </div>

        <div class="pedagogical-notice">
            <span>Estação de Testes:</span> Sistema disponibilizado para avaliação de qualidade.
        </div>
    </div>

    <!-- Link para o Mini-game -->
    <a href="minigame.html" class="minigame-link" title="Aprenda sobre Casos de Teste">
        🎮 <span>Teste o jogo</span>
    </a>

    <script src="app.js"></script>
</body>
</html>
